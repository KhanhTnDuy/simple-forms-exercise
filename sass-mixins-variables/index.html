<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASS variables và mixins</title>
    <!-- css/main.css được biên dịch từ scss/main.scss -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <h1>Heading 1 dùng $font-large</h1>
    <h2>Heading 2 dùng $font-medium</h2>
    <div class="card">
        <p>Card dùng mixin <code>box-style</code>.</p>
        <button class="button" style="border:0;font-size:1rem;cursor:pointer">Button dùng mixin</button>
    </div>
</body>
</html>
