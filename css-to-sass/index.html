<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển CSS sang SASS</title>
    <!-- css/main.css được biên dịch từ scss/main.scss -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container">
        <h1>Chuyển CSS sang SASS theo chuẩn</h1>
        <div class="card">
            <h3>Card dùng biến và mixin</h3>
            <p>Viền, đổ bóng lấy từ <code>$border-color</code> và <code>$box-shadow</code>.</p>
            <button class="button" style="border:0;font-size:1rem;cursor:pointer">Button dùng mixin</button>
        </div>
    </div>
</body>
</html>
