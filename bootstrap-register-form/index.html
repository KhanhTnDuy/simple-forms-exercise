<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 text-center mb-1">Đăng ký tài khoản</h1>
                        <p class="text-center text-muted mb-4">Điền đầy đủ thông tin bên dưới để tạo tài khoản mới</p>

                        <form id="registerForm" action="#">
                            <!-- Họ và tên -->
                            <div class="mb-3">
                                <label for="fullname" class="form-label">Họ và tên</label>
                                <input type="text" class="form-control" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                                <div class="form-text text-muted">Chúng tôi sẽ không chia sẻ email của bạn với bất kỳ ai.</div>
                            </div>

                            <!-- Mật khẩu -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" name="password" minlength="6" required>
                                <div class="form-text text-muted">Mật khẩu tối thiểu 6 ký tự.</div>
                            </div>

                            <!-- Xác nhận mật khẩu -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                                <div class="invalid-feedback">Mật khẩu xác nhận không khớp.</div>
                            </div>

                            <!-- Giới tính (radio) -->
                            <div class="mb-3">
                                <label class="form-label d-block">Giới tính</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                    <label class="form-check-label" for="genderMale">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                    <label class="form-check-label" for="genderFemale">Nữ</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                    <label class="form-check-label" for="genderOther">Khác</label>
                                </div>
                            </div>

                            <!-- Sở thích (checkbox) -->
                            <div class="mb-3">
                                <label class="form-label d-block">Sở thích</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" name="hobby" id="hobbyReading" value="reading">
                                    <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" name="hobby" id="hobbyMusic" value="music">
                                    <label class="form-check-label" for="hobbyMusic">Nghe nhạc</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" name="hobby" id="hobbyTravel" value="travel">
                                    <label class="form-check-label" for="hobbyTravel">Du lịch</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" name="hobby" id="hobbyCoding" value="coding">
                                    <label class="form-check-label" for="hobbyCoding">Lập trình</label>
                                </div>
                            </div>

                            <!-- Quốc gia (select) -->
                            <div class="mb-4">
                                <label for="country" class="form-label">Quốc gia</label>
                                <select class="form-select" id="country" name="country" required>
                                    <option value="" selected disabled>-- Chọn quốc gia --</option>
                                    <option value="vn">Việt Nam</option>
                                    <option value="us">Hoa Kỳ</option>
                                    <option value="jp">Nhật Bản</option>
                                    <option value="kr">Hàn Quốc</option>
                                    <option value="other">Khác</option>
                                </select>
                            </div>

                            <!-- Nút Submit -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Đăng ký</button>
                            </div>

                            <p class="text-center text-muted mt-3 mb-0">Đã có tài khoản? <a href="#">Đăng nhập</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Kiểm tra mật khẩu xác nhận phải khớp với mật khẩu
        var password = document.getElementById("password");
        var confirmPassword = document.getElementById("confirmPassword");

        function checkPasswordMatch() {
            if (confirmPassword.value !== password.value) {
                confirmPassword.setCustomValidity("Mật khẩu xác nhận không khớp");
                confirmPassword.classList.add("is-invalid");
            } else {
                confirmPassword.setCustomValidity("");
                confirmPassword.classList.remove("is-invalid");
            }
        }

        password.addEventListener("input", checkPasswordMatch);
        confirmPassword.addEventListener("input", checkPasswordMatch);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
