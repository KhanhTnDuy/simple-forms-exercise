<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive grid</title>
<!-- css/main.css được biên dịch từ scss/main.scss -->
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="gridoverlay">
<div class="gridcontainer">
<div class="gridwrapper gridwrapper--header">
<div class="gridcontent gridcontent--header">
</div>
</div>
<div class="gridwrapper gridwrapper--body">
  <div class="gridcontent gridcontent--panel">
    <div class="gridblock"></div>
    <div class="gridblock"></div>
    <div class="gridblock"></div>
    <div class="gridblock"></div>
  </div>
  <div class="gridcontent gridcontent--white"></div>
  <div class="gridcontent gridcontent--white"></div>
  <div class="gridcontent gridcontent--white"></div>
  <div class="gridcontent gridcontent--white"></div>
  <div class="gridcontent gridcontent--white"></div>
  <div class="gridcontent gridcontent--white"></div>
  <div class="gridcontent gridcontent--panel">
    <div class="gridblock gridblock--tall"></div>
  </div>
</div>
<div class="gridwrapper gridwrapper--footer">
  <div class="gridcontent gridcontent--footer">
  </div>
</div>

</div>
</div>
<div class="gridcontainer gridcontainer--faint">
<div class="gridwrapper gridwrapper--guide">
  <div class="gridcontent gridcontent--guide"></div>
  <div class="gridcontent gridcontent--guide"></div>
  <div class="gridcontent gridcontent--guide"></div>
  <div class="gridcontent gridcontent--guide"></div>
  <div class="gridcontent gridcontent--guide"></div>
  <div class="gridcontent gridcontent--guide"></div>
  <div class="gridcontent gridcontent--guide"></div>
  <div class="gridcontent gridcontent--guide"></div>
  <div class="gridcontent gridcontent--guide"></div>
  <div class="gridcontent gridcontent--guide"></div>
  <div class="gridcontent gridcontent--guide"></div>
  <div class="gridcontent gridcontent--guide"></div>
</div>
</div>

<p>Resize the browser window to see that this grid will respond to the resizing, and always use 100% of the available space.</p>

</body>
</html>
