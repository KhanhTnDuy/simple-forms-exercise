<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form thông tin</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f2f5f9;
            margin: 0;
            padding: 30px 16px;
        }
        .form-box {
            max-width: 460px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 24px 28px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }
        h2 {
            text-align: center;
            color: #1a56a0;
            margin-top: 0;
        }
        label.field {
            display: block;
            font-weight: bold;
            margin: 14px 0 6px;
            color: #333333;
        }
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 1px solid #b8c2cc;
            border-radius: 4px;
            font-size: 15px;
        }
        .hobbies label {
            display: inline-block;
            margin-right: 14px;
            font-weight: normal;
        }
        .buttons {
            margin-top: 22px;
            text-align: center;
        }
        .buttons input {
            padding: 9px 22px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            color: #ffffff;
            cursor: pointer;
            margin: 0 6px;
        }
        .btn-submit { background-color: #1a56a0; }
        .btn-reset { background-color: #7a8794; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Thông tin cá nhân</h2>
        <form action="#" method="get">
            <label class="field" for="yourname">Họ và tên</label>
            <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên">

            <label class="field" for="email">Email</label>
            <input type="text" id="email" name="email" placeholder="Nhập email">

            <label class="field">Sở thích</label>
            <div class="hobbies">
                <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
                <label><input type="checkbox" name="hobby" value="travel"> Du lịch</label>
                <label><input type="checkbox" name="hobby" value="music"> Âm nhạc</label>
                <label><input type="checkbox" name="hobby" value="sports"> Thể thao</label>
            </div>

            <div class="buttons">
                <input type="submit" class="btn-submit" value="Gửi thông tin">
                <input type="reset" class="btn-reset" value="Nhập lại">
            </div>
        </form>
    </div>
</body>
</html>
