<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS | grid-column-start</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Giá trị auto</h2>
    <div class="grid-container example-auto">
        <div class="item1">1</div>
        <div>2</div>
        <div>3</div>
    </div>

    <h2>Giá trị span n (span 2)</h2>
    <div class="grid-container example-span">
        <div class="item1">Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>

    <h2>Giá trị column-line (đường kẻ cột số 2)</h2>
    <div class="grid-container example-line">
        <div class="item1">Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>
</body>
</html>
