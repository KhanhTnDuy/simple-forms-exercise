<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS | flex-grow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Mặc định: flex-grow: 0 (không item nào giãn)</h2>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>

    <h2>Item 2 có flex-grow: 4</h2>
    <div class="container">
        <div>1</div>
        <div class="grow">2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>
</body>
</html>
