    <circle cx="130" cy="74" r="10" fill="#1f2937"/>
    <circle cx="102" cy="130" r="26" fill="url(#lens)" stroke="#6b7280" stroke-width="3"/>
    <circle cx="102" cy="130" r="10" fill="#1f2937"/>
    <circle cx="146" cy="136" r="9" fill="#fde68a" stroke="#6b7280" stroke-width="2"/>
    <!-- Logo giả định -->
    <circle cx="150" cy="340" r="26" fill="none" stroke="#6b7280" stroke-width="5" stroke-opacity="0.6"/>
