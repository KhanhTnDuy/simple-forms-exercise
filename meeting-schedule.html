<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch họp công ty</title>
</head>
<body>

    <h1>Lịch họp công ty</h1>

    <table border="1" cellpadding="8" cellspacing="0">
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>
        <tr>
            <td rowspan="3">Thứ Hai</td>
            <td>08:00 - 09:00</td>
            <td>Họp giao ban đầu tuần</td>
        </tr>
        <tr>
            <td>10:00 - 11:30</td>
            <td>Họp kế hoạch quý</td>
        </tr>
        <tr>
            <td>14:00 - 15:00</td>
            <td>Họp phòng kinh doanh</td>
        </tr>
        <tr>
            <td rowspan="2">Thứ Tư</td>
            <td>09:00 - 10:00</td>
            <td>Họp đánh giá dự án</td>
        </tr>
        <tr>
            <td>15:00 - 16:30</td>
            <td>Họp với đối tác</td>
        </tr>
        <tr>
            <td>Thứ Sáu</td>
            <td colspan="2">Cả ngày (08:00 - 17:00): Hội thảo và đào tạo nội bộ</td>
        </tr>
    </table>

</body>
</html>
